name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    # macos-15 is the arm64 (Apple Silicon) hosted runner.
    runs-on: macos-15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check brand assets
        run: |
          test -f shell/mygo/resources/icon.png
          test -f shell/mygo/resources/icon-dev.png

      - name: Install pinned MyGo CLI
        run: |
          go install github.com/egoist/mygo/cmd/mygo@v0.10.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build app and DMG
        working-directory: shell/mygo
        run: mygo build

      - name: Verify packaged app
        run: |
          test -f frontend-dist/index.html
          test -f build/darwin-arm64/Sasmita.app/Contents/Resources/AppIcon.icns
          test "$(plutil -extract CFBundleIconFile raw build/darwin-arm64/Sasmita.app/Contents/Info.plist)" = "AppIcon.icns"
          hdiutil verify build/darwin-arm64/*.dmg

      - name: Checksum
        run: shasum -a 256 build/darwin-arm64/*.dmg > build/darwin-arm64/SHA256SUMS.txt

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            build/darwin-arm64/*.dmg
            build/darwin-arm64/SHA256SUMS.txt
