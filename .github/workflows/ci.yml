name: ci

on:
  pull_request:
  push:
    branches: [main, dev, integration/v1-core]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Frontend tests
        run: npm run test:e2e

      - name: Go tests
        run: go test -count=1 ./...

      - name: Cross-compile for macOS arm64
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
